# nginx.conf — Reverse proxy for MedQuery Pipeline API
#
# PURPOSE
#   - Hides your EC2 IP: uvicorn listens on 127.0.0.1:8000 (localhost only)
#     and this Nginx config is the ONLY public entry point.
#   - Strips fingerprinting headers (Server, X-Powered-By).
#   - Rate-limits uploads to prevent abuse.
#   - Handles large PDF uploads and long OCR timeouts.
#   - Ready for HTTPS / Let's Encrypt (see HTTPS server block below).
#
# INSTALL
#   sudo apt install nginx -y
#   sudo cp nginx.conf /etc/nginx/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# EXTRA IP PROTECTION (recommended)
#   Point your domain at Cloudflare with "Proxy" (orange cloud) enabled.
#   Cloudflare's CDN becomes the public face; your EC2 IP never appears
#   in DNS and is only reachable via Cloudflare's edge network.
#   In the AWS Security Group, allow port 443/80 only from Cloudflare IP
#   ranges: https://www.cloudflare.com/ips/

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ── Fingerprint suppression ───────────────────────────────────────────────
    server_tokens off;                    # hide nginx version in headers/errors

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/medquery_access.log;
    error_log  /var/log/nginx/medquery_error.log warn;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # 5 requests/second per IP with a burst allowance of 10.
    # PDF uploads are slow anyway, so this is generous.
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_status 429;

    # ── Upstream: FastAPI (localhost only) ────────────────────────────────────
    upstream medquery {
        server 127.0.0.1:8000;
        keepalive 8;
    }

    # ── Shared proxy settings ─────────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Connection      "";          # enable keepalive
    proxy_set_header    Host            $host;
    proxy_set_header    X-Real-IP       $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;

    # Large PDF uploads + slow OCR jobs (match JOB_TIMEOUT_SECS + buffer)
    client_max_body_size  100M;
    proxy_read_timeout    960s;
    proxy_send_timeout    960s;
    proxy_connect_timeout 10s;

    # ── Response header hardening ─────────────────────────────────────────────
    proxy_hide_header   X-Powered-By;
    proxy_hide_header   Server;
    add_header          X-Frame-Options     DENY        always;
    add_header          X-Content-Type-Options nosniff  always;
    add_header          Referrer-Policy     no-referrer always;

    # =========================================================================
    # HTTP server — redirects to HTTPS when cert is in place.
    # While testing without a cert, this block serves directly.
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;   # replace with your domain once DNS is set up

        # ── Uncomment to force HTTPS once you have a cert ─────────────────────
        # return 301 https://$host$request_uri;

        # ── Direct HTTP (testing / no cert yet) ───────────────────────────────
        location / {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://medquery;

            # Health-check endpoint skips rate limit
            location /health {
                limit_req off;
                proxy_pass http://medquery;
            }
        }
    }

    # =========================================================================
    # HTTPS server — enable once you have a TLS certificate.
    #
    # Quick cert with Let's Encrypt:
    #   sudo apt install certbot python3-certbot-nginx -y
    #   sudo certbot --nginx -d your-domain.com
    # =========================================================================
    # server {
    #     listen 443 ssl http2 default_server;
    #     listen [::]:443 ssl http2 default_server;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     location / {
    #         limit_req zone=api burst=10 nodelay;
    #         proxy_pass http://medquery;
    #     }
    #
    #     location /health {
    #         limit_req off;
    #         proxy_pass http://medquery;
    #     }
    # }
}
